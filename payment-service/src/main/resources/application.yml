server:
  port: 8085

spring:
  application:
    name: payment-service

  boot:
    admin:
      client:
        url: http://localhost:8761

  datasource:
    url: jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:medibook_user}
    password: ${DB_PASSWORD:medibook_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://admin:medibook123@localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

razorpay:
  key:
    # ✅ FIX: Changed from ${RAZORPAY-API-KEY} and ${RAZORPAY-KEY-SECRET}
    # Windows environment variables use UNDERSCORES not hyphens.
    # Your system env vars are: RAZORPAY_API_KEY and RAZORPAY_KEY_SECRET
    id: ${RAZORPAY_API_KEY}
    secret: ${RAZORPAY_KEY_SECRET}
  currency: INR
  

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    try-it-out-enabled: true
  api-docs:
    path: /api-docs