server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  boot:
    admin:
      client:
        url: ${BOOT_ADMIN_URL:http://localhost:8761}
        username: ${BOOT_ADMIN_USERNAME:admin}
        password: ${BOOT_ADMIN_PASSWORD:medibook123}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
      repositories:
        enabled: false
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - ${GATEWAY_ALLOWED_ORIGIN_PATTERN_1:http://localhost:[*]}
              - ${GATEWAY_ALLOWED_ORIGIN_PATTERN_2:http://127.0.0.1:[*]}
              - ${GATEWAY_ALLOWED_ORIGIN_PATTERN_3:http://*.nip.io:[*]}
              - ${GATEWAY_ALLOWED_ORIGIN_PATTERN_4:https://*.nip.io:[*]}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
            exposedHeaders:
              - Authorization
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**,/oauth2/**,/login/oauth2/**
        - id: provider-service
          uri: lb://provider-service
          predicates:
            - Path=/providers/**
        - id: schedule-service
          uri: lb://schedule-service
          predicates:
            - Path=/slots/**
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/appointments/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/reviews/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**
        - id: record-service
          uri: lb://record-service
          predicates:
            - Path=/records/**
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/admin/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://admin:medibook123@localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:${HOSTNAME:localhost}}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.springframework.cloud.gateway: INFO

