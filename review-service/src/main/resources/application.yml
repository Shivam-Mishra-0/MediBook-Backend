server:
  port: ${PORT:8086}

spring:
  application:
    name: review-service
  boot:
    admin:
      client:
        url: ${BOOT_ADMIN_URL:http://localhost:8761}
        username: ${BOOT_ADMIN_USERNAME:admin}
        password: ${BOOT_ADMIN_PASSWORD:medibook123}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/review_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:medibook_user}
    password: ${DB_PASSWORD:medibook_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

medibook:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://admin:medibook123@localhost:8761/eureka/}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:${HOSTNAME:localhost}}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    try-it-out-enabled: true

