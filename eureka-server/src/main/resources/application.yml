server:
    port: 8761

spring:
    application:
        name: eureka-server
    security:
        user:
            name: admin
            password: medibook123

eureka:
    instance:
        hostname: localhost
    client:
        # This IS the server — it does not register with itself
        register-with-eureka: false
        fetch-registry: false
        service-url:
            defaultZone: http://admin:medibook123@localhost:8761/eureka/
    server:
        wait-time-in-ms-when-sync-empty: 0
        enable-self-preservation: false

management:
    endpoints:
        web:
            exposure:
                include: health, info
